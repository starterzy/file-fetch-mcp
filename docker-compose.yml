services:
  file-fetch-mcp:
    build: .
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 8080
      MINERU_API_BASE_URL: http://mineru-api:8000
      MINERU_API_HEALTH_PATH: /health
      MINERU_TASK_TIMEOUT_SECONDS: 180
      MINERU_POLL_INTERVAL_SECONDS: 2
      DOWNLOAD_MAX_BYTES: 52428800
      # Set to true only when this MCP is intentionally allowed to fetch internal URLs.
      ALLOW_PRIVATE_NETWORK_URLS: "false"
    ports:
      - "8080:8080"
    depends_on:
      mineru-api:
        condition: service_healthy
    networks: [file-fetch]

  # MinerU is intentionally an external deployment in production. This service
  # is only a placeholder showing the network contract.
  mineru-api:
    image: ${MINERU_IMAGE:-docker.io/alexsuntop/mineru:3.4.2}
    command: ["mineru-api", "--host", "0.0.0.0", "--port", "8000"]
    expose: ["8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8000/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [file-fetch]

networks:
  file-fetch:
